{% extends "base.html" %}

{% block title %}
Too Many Requests
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>429</h1>

    <h2>Too Many Requests</h2>

    <p class="form-description">
        Too many login attempts were received from your IP address.
        Please wait before trying again.
    </p>

    <a href="{{ url_for('login') }}" class="button">
        Return to Login
    </a>

</div>

{% endblock %}
